name: oxa macOS (non-required)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'oxa/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

concurrency:
  group: oxa-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oxa-macos:
    name: oxa release workspace (macOS arm64, non-required)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated environment and release toolchain
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          # Keep toolchains and scratch on checkout storage. Resolve symlinks so
          # unchanged credential-isolation guards see canonical synthetic paths.
          root=$(mktemp -d "$GITHUB_WORKSPACE/.oxa-macos.XXXXXX")
          root=$(cd "$root" && pwd -P)
          mkdir -p "$root/home" "$root/cargo" "$root/rustup" "$root/tmp"
          export HOME="$root/home" CARGO_HOME="$root/cargo" RUSTUP_HOME="$root/rustup" TMPDIR="$root/tmp"
          rustup toolchain install 1.99.1 --profile minimal
          for name in HOME CARGO_HOME RUSTUP_HOME TMPDIR; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          echo "$RUSTUP_HOME/toolchains/1.99.1-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"
      - name: Check release test targets before linking
        working-directory: oxa
        run: |
          env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" TMPDIR="$TMPDIR" CARGO_BUILD_JOBS=3 \
            DYLD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.99.1-aarch64-apple-darwin/lib" \
            cargo check --release --locked --workspace --tests
      - name: Build release workspace (Linux release default features)
        working-directory: oxa
        run: |
          env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" TMPDIR="$TMPDIR" CARGO_BUILD_JOBS=3 \
            DYLD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.99.1-aarch64-apple-darwin/lib" \
            cargo build --release --locked --workspace
      - name: Unsupported atomic creation refuses before staging or sync
        working-directory: oxa
        shell: bash
        run: |
          guard=openai::chatgpt_tokens::publication_tests::unsupported_create_only_refuses_before_staging_or_sync
          guard_test() {
            env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
              RUSTUP_HOME="$RUSTUP_HOME" TMPDIR="$TMPDIR" CARGO_BUILD_JOBS=3 \
              DYLD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.99.1-aarch64-apple-darwin/lib" \
              cargo test --release --locked -p oxc-gateway \
              --features anthropic-gateway,upstream-openai --lib "$@"
          }
          guard_test -- --list | grep -Fx "$guard: test"
          guard_test "$guard" -- --exact
      - name: Test release workspace
        working-directory: oxa
        run: |
          env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" TMPDIR="$TMPDIR" CARGO_BUILD_JOBS=3 \
            DYLD_LIBRARY_PATH="$RUSTUP_HOME/toolchains/1.99.1-aarch64-apple-darwin/lib" \
            OXA_BIN="$PWD/target/release/oxa" OXA_FAKE_BIN="$PWD/target/release/oxa-fake" \
            cargo test --release --locked --workspace --no-fail-fast
