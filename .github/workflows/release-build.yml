name: release-build
# Artifact-only qualification. No tags, schedules, credentials, or publication jobs.
on:
  workflow_call:
    inputs:
      version:
        description: release tag, used in the archive names
        type: string
        default: v0.2.1
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/release-build.yml'
      - 'packaging/**'
      - 'docs/RELEASE.md'
      - 'oxa/oxa-cli/tests/no_python_in_path.rs'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version || 'v0.2.1' }}
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  CARGO_BUILD_JOBS: '2'

jobs:
  binaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: CPU artifacts (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      options: --memory=8g --memory-swap=8g --cgroupns=private
    timeout-minutes: 180
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_epoch: ${{ steps.source.outputs.epoch }}
    steps:
      - name: Git before checkout (prevent REST archive fallback)
        run: dnf -y -q install --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GCC 16 and pinned Rust 1.99.1
        run: packaging/release/setup.sh
      - name: Verify inherited native no-swap policy
        run: |
          set -euo pipefail
          test "$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)" = /
          test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          test "$(cat /sys/fs/cgroup/memory.swap.current)" = 0
      - name: Immutable source archive
        id: source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          mkdir -p /build/first /build/second dist
          git archive --format=tar --prefix="ox-llm-$commit/" HEAD | gzip -n -9 > "dist/ox-llm-$commit.tar.gz"
          git archive HEAD | tar -xf - -C /build/first
          git archive HEAD | tar -xf - -C /build/second
      - name: Build twice in different directories; compare complete payload hashes
        run: |
          for build in first second; do
            cd "/build/$build"
            packaging/release/build.sh
            python3 -B packaging/release/stage.py /build/payload
            packaging/release/archive.sh /build/payload "/build/$build.tar.gz"
            rm -rf /build/payload
          done
          cmp /build/first.tar.gz /build/second.tar.gz
          arch=$(uname -m)
          cp /build/first.tar.gz "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$arch.tar.gz"
          echo 'PASS: two clean builds in different source/target directories produced identical payload tarballs.' \
            > "$GITHUB_WORKSPACE/dist/REPRODUCIBILITY.txt"
          { rustc --version; cargo --version; cc --version; c++ --version; ld --version; rpm -q glibc libstdc++; } \
            > "$GITHUB_WORKSPACE/dist/TOOLCHAIN.txt"
      - name: No-Python proof on the exact release tarball binary
        id: native_proof
        working-directory: /build/first
        run: |
          set -euo pipefail
          source packaging/release/environment.sh
          artifact="$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).tar.gz"
          extracted=$(mktemp -d)
          sandbox=$(mktemp -d)
          trap 'rm -rf "$extracted" "$sandbox"' EXIT
          tar -xzf "$artifact" -C "$extracted"
          test -x "$extracted/usr/bin/oxa"
          test -x "$extracted/usr/bin/oxe-server"
          oxa_sha256=$(sha256sum "$extracted/usr/bin/oxa" | cut -d' ' -f1)
          oxe_sha256=$(sha256sum "$extracted/usr/bin/oxe-server" | cut -d' ' -f1)
          receipt="$GITHUB_WORKSPACE/dist/NO-PYTHON-PROOF.txt"
          { printf 'source=%s\n' "$GITHUB_SHA"; sha256sum "$artifact" | cut -d' ' -f1;
            (cd "$extracted/usr/bin" && sha256sum oxa oxe-server); } > "$receipt"
          cd oxa
          cargo fetch --locked
          env -i PATH="$PATH" HOME="$sandbox" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            RUSTUP_TOOLCHAIN=1.99.1 CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            RUSTFLAGS="$RUSTFLAGS" OXA_TEST_RELEASE_OXA="$extracted/usr/bin/oxa" \
            OXA_TEST_RELEASE_OXE_SERVER="$extracted/usr/bin/oxe-server" \
            OXA_TEST_RELEASE_OXA_SHA256="$oxa_sha256" \
            OXA_TEST_RELEASE_OXE_SERVER_SHA256="$oxe_sha256" \
            OXA_TEST_REQUIRE_RELEASE_ARTIFACT=1 \
            cargo test --profile ci --locked -p oxa-cli --test no_python_in_path -- --nocapture \
            2>&1 | tee -a "$receipt"
      - name: Diagnose native memory admission failure (read only)
        if: failure() && steps.native_proof.outcome == 'failure'
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re
          proc = pathlib.Path('/proc')
          report = {}
          def read(path):
              try:
                  return path.read_text()
              except OSError:
                  return ''
          def field(name, text, key=None):
              if key is not None:
                  rows = [line.split()[1:] for line in text.splitlines()
                          if line.split() and line.split()[0] == key]
                  text = rows[0][0] if len(rows) == 1 and rows[0] else ''
              text = text.strip()
              report[name] = text if re.fullmatch(r'[0-9]+(?:\.[0-9]+)?|max', text) else 'missing-or-invalid'
          membership = [line[3:] for line in read(proc / 'self/cgroup').splitlines()
                        if line.startswith('0::')]
          relative = membership[0] if len(membership) == 1 else ''
          parts = relative.split('/')[1:]
          valid = relative.startswith('/') and all(p not in ('.', '..') for p in parts)
          # Classify membership without emitting runner-specific cgroup names.
          report['membership'] = 'root' if relative == '/' else 'nested' if valid else 'invalid'
          if valid:
              group = pathlib.Path('/sys/fs/cgroup') / relative.lstrip('/')
              for name in ('memory.swap.max', 'memory.swap.current'):
                  field(name, read(group / name))
              for key in ('oom', 'oom_kill', 'oom_group_kill'):
                  field('memory.events.' + key, read(group / 'memory.events'), key)
              field('pids.events.max', read(group / 'pids.events'), 'max')
          for key in ('MemAvailable:', 'SwapFree:'):
              field(key.rstrip(':') + '_kib', read(proc / 'meminfo'), key)
          field('vmstat.oom_kill', read(proc / 'vmstat'), 'oom_kill')
          pressure = read(proc / 'pressure/memory')
          full = [line for line in pressure.splitlines() if line.startswith('full ')]
          avg = re.findall(r'(?:^| )avg10=([^ ]+)', full[0]) if len(full) == 1 else []
          field('psi.full.avg10', avg[0] if len(avg) == 1 else '')
          print('NATIVE-MEMORY-DIAGNOSTIC ' + json.dumps(report, sort_keys=True))
          PY
      - name: Model-free source tests
        working-directory: /build/first
        run: packaging/release/check.sh
      - name: CycloneDX SBOM and checksums
        run: |
          cd /build/first
          mkdir -p /build/payload
          tar -xzf "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).tar.gz" -C /build/payload
          python3 -B packaging/release/sbom.py /build/payload "$GITHUB_WORKSPACE/dist/SBOM.cdx.json"
          cp "$GITHUB_WORKSPACE/dist/SBOM.cdx.json" "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).sbom.cdx.json"
          python3 -B - <<'PY'
          import os, pathlib, re
          payload = pathlib.Path('/build/payload')
          prefixes = [b'/build/first', b'/build/second', os.fsencode(os.environ['HOME']), b'/opt/cargo', b'/opt/rustup']
          for binary in (payload / 'usr/bin').iterdir():
              data = binary.read_bytes()
              assert not any(prefix in data for prefix in prefixes), binary.name
              assert not re.search(rb'/home/[^/\x00\s]+/', data), binary.name
          PY
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  arch-clean-install:
    name: Arch source + binary packages, namcap, clean install and removal
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version || 'v0.2.1' }}
      SOURCE_DATE_EPOCH: ${{ needs.binaries.outputs.source_epoch }}
      OX_SOURCE_COMMIT: ${{ needs.binaries.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-x86_64
          path: artifacts
      - name: Fresh Arch container (official image is x86_64 only)
        run: |
          mkdir packages
          docker run --rm --memory=8g --memory-swap=8g --cgroupns=private \
            -e VERSION -e SOURCE_DATE_EPOCH -e OX_SOURCE_COMMIT \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            -v "$GITHUB_WORKSPACE/packages:/packages" \
            -v "$GITHUB_WORKSPACE/packaging/arch:/recipes:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/smoke.py:/smoke.py:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/arch-test.sh:/arch-test.sh:ro" \
            archlinux:latest bash /arch-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-packages-x86_64
          path: packages/
          if-no-files-found: error
          retention-days: 7
