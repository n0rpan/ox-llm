name: release-build
# Artifact-only qualification. No tags, schedules, credentials, or publication jobs.
on:
  workflow_call:
    inputs:
      version:
        description: release tag, used in the archive names
        type: string
        default: v0.2.1
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/release-build.yml'
      - 'packaging/**'
      - 'docs/RELEASE.md'
      - 'oxa/oxa-cli/tests/no_python_in_path.rs'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version || 'v0.2.1' }}
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  CARGO_BUILD_JOBS: '2'

jobs:
  ram_arm:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 5
    name: Measure ARM runner RAM for container budget
    runs-on: ubuntu-24.04-arm
    outputs:
      bytes: ${{ steps.ram.outputs.bytes }}
    steps:
      - id: ram
        run: |
          bytes=$(awk '/^MemTotal:/ { printf "%.0f", int($2 * 3 / 4 / 1024) * 1048576 }' /proc/meminfo)
          test "$bytes" -gt 0
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
  ram_x64:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 5
    name: Measure x64 runner RAM for container budget
    runs-on: ubuntu-latest
    outputs:
      bytes: ${{ steps.ram.outputs.bytes }}
    steps:
      - id: ram
        run: |
          bytes=$(awk '/^MemTotal:/ { printf "%.0f", int($2 * 3 / 4 / 1024) * 1048576 }' /proc/meminfo)
          test "$bytes" -gt 0
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
  binaries:
    needs: [ram_arm, ram_x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: CPU artifacts (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      # Probe the runner class before container creation; verify against this host below.
      options: >-
        --memory=${{ matrix.arch == 'aarch64' && needs.ram_arm.outputs.bytes || needs.ram_x64.outputs.bytes }}
        --memory-swap=${{ matrix.arch == 'aarch64' && needs.ram_arm.outputs.bytes || needs.ram_x64.outputs.bytes }}
        --cgroupns=private
    timeout-minutes: 180
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_epoch: ${{ steps.source.outputs.epoch }}
    steps:
      - name: Git before checkout (prevent REST archive fallback)
        run: dnf -y -q install --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GCC 16 and pinned Rust 1.99.1
        run: packaging/release/setup.sh
      - name: Verify inherited native no-swap policy
        run: |
          set -euo pipefail
          require() { if ! "$@"; then printf 'NATIVE-MEMORY-REFUSAL: %s\n' "$predicate" >&2; exit 1; fi; }
          predicate='unified cgroup membership must be root'
          require test "$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)" = /
          predicate='memory.swap.max must be 0'
          require test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          predicate='memory.swap.current must be 0'
          require test "$(cat /sys/fs/cgroup/memory.swap.current)" = 0
          host_budget=$(awk '/^MemTotal:/ { printf "%.0f", int($2 * 3 / 4 / 1024) * 1048576 }' /proc/meminfo)
          limit=$(cat /sys/fs/cgroup/memory.max)
          predicate='memory.max must be a positive numeric cap within three quarters of actual host RAM'
          [[ $limit =~ ^[0-9]+$ ]] || { printf 'NATIVE-MEMORY-REFUSAL: %s\n' "$predicate" >&2; exit 1; }
          require test "$limit" -gt 0
          require test "$limit" -le "$host_budget"
          printf 'NATIVE-MEMORY-BUDGET limit=%s host_budget=%s\n' "$limit" "$host_budget"
      - name: Immutable source archive
        id: source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          mkdir -p /build/first /build/second dist
          git archive --format=tar --prefix="ox-llm-$commit/" HEAD | gzip -n -9 > "dist/ox-llm-$commit.tar.gz"
          git archive HEAD | tar -xf - -C /build/first
          git archive HEAD | tar -xf - -C /build/second
      - name: Build twice in different directories; compare complete payload hashes
        run: |
          for build in first second; do
            cd "/build/$build"
            packaging/release/build.sh
            python3 -B packaging/release/stage.py /build/payload
            packaging/release/archive.sh /build/payload "/build/$build.tar.gz"
            rm -rf /build/payload
          done
          cmp /build/first.tar.gz /build/second.tar.gz
          arch=$(uname -m)
          cp /build/first.tar.gz "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$arch.tar.gz"
          echo 'PASS: two clean builds in different source/target directories produced identical payload tarballs.' \
            > "$GITHUB_WORKSPACE/dist/REPRODUCIBILITY.txt"
          { rustc --version; cargo --version; cc --version; c++ --version; ld --version; rpm -q glibc libstdc++; } \
            > "$GITHUB_WORKSPACE/dist/TOOLCHAIN.txt"
      - name: No-Python proof on the exact release tarball binary
        id: native_proof
        working-directory: /build/first
        run: |
          set -euo pipefail
          source packaging/release/environment.sh
          artifact="$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).tar.gz"
          extracted=$(mktemp -d)
          sandbox=$(mktemp -d)
          trap 'rm -rf "$extracted" "$sandbox"' EXIT
          tar -xzf "$artifact" -C "$extracted"
          test -x "$extracted/usr/bin/oxa"
          test -x "$extracted/usr/bin/oxe-server"
          oxa_sha256=$(sha256sum "$extracted/usr/bin/oxa" | cut -d' ' -f1)
          oxe_sha256=$(sha256sum "$extracted/usr/bin/oxe-server" | cut -d' ' -f1)
          receipt="$GITHUB_WORKSPACE/dist/NO-PYTHON-PROOF.txt"
          { printf 'source=%s\n' "$GITHUB_SHA"; sha256sum "$artifact" | cut -d' ' -f1;
            (cd "$extracted/usr/bin" && sha256sum oxa oxe-server); } > "$receipt"
          cd oxa
          cargo fetch --locked
          env -i PATH="$PATH" HOME="$sandbox" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            RUSTUP_TOOLCHAIN=1.99.1 CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            RUSTFLAGS="$RUSTFLAGS" OXA_TEST_RELEASE_OXA="$extracted/usr/bin/oxa" \
            OXA_TEST_RELEASE_OXE_SERVER="$extracted/usr/bin/oxe-server" \
            OXA_TEST_RELEASE_OXA_SHA256="$oxa_sha256" \
            OXA_TEST_RELEASE_OXE_SERVER_SHA256="$oxe_sha256" \
            OXA_TEST_REQUIRE_RELEASE_ARTIFACT=1 \
            cargo test --profile ci --locked -p oxa-cli --test no_python_in_path -- --nocapture \
            2>&1 | tee -a "$receipt"
      - name: Preserve the exact-source x64 proof harness
        if: matrix.arch == 'x86_64'
        working-directory: /build/first/oxa
        run: |
          set -euo pipefail
          mapfile -d '' harnesses < <(find target/ci/deps -maxdepth 1 -name 'no_python_in_path-*' -type f -perm -100 -print0)
          test "${#harnesses[@]}" = 1
          mkdir "$GITHUB_WORKSPACE/proof-harness"
          cp "${harnesses[0]}" "$GITHUB_WORKSPACE/proof-harness/no-python-proof"
          cd "$GITHUB_WORKSPACE/proof-harness"
          printf '%s\n' "$GITHUB_SHA" > SOURCE-COMMIT
          sha256sum no-python-proof SOURCE-COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x86_64'
        with:
          name: release-proof-harness-x86_64
          path: proof-harness/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose native memory admission failure (read only)
        if: failure() && steps.native_proof.outcome == 'failure'
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re
          proc = pathlib.Path('/proc')
          report = {}
          def read(path):
              try:
                  return path.read_text()
              except OSError:
                  return ''
          def field(name, text, key=None):
              if key is not None:
                  rows = [line.split()[1:] for line in text.splitlines()
                          if line.split() and line.split()[0] == key]
                  text = rows[0][0] if len(rows) == 1 and rows[0] else ''
              text = text.strip()
              report[name] = text if re.fullmatch(r'[0-9]+(?:\.[0-9]+)?|max', text) else 'missing-or-invalid'
          membership = [line[3:] for line in read(proc / 'self/cgroup').splitlines()
                        if line.startswith('0::')]
          relative = membership[0] if len(membership) == 1 else ''
          parts = relative.split('/')[1:]
          valid = relative.startswith('/') and all(p not in ('.', '..') for p in parts)
          # Classify membership without emitting runner-specific cgroup names.
          report['membership'] = 'root' if relative == '/' else 'nested' if valid else 'invalid'
          if valid:
              group = pathlib.Path('/sys/fs/cgroup') / relative.lstrip('/')
              for name in ('memory.swap.max', 'memory.swap.current'):
                  field(name, read(group / name))
              for key in ('oom', 'oom_kill', 'oom_group_kill'):
                  field('memory.events.' + key, read(group / 'memory.events'), key)
              field('pids.events.max', read(group / 'pids.events'), 'max')
          for key in ('MemAvailable:', 'SwapFree:'):
              field(key.rstrip(':') + '_kib', read(proc / 'meminfo'), key)
          field('vmstat.oom_kill', read(proc / 'vmstat'), 'oom_kill')
          pressure = read(proc / 'pressure/memory')
          full = [line for line in pressure.splitlines() if line.startswith('full ')]
          avg = re.findall(r'(?:^| )avg10=([^ ]+)', full[0]) if len(full) == 1 else []
          field('psi.full.avg10', avg[0] if len(avg) == 1 else '')
          print('NATIVE-MEMORY-DIAGNOSTIC ' + json.dumps(report, sort_keys=True))
          PY
      - name: Model-free source tests
        working-directory: /build/first
        run: packaging/release/check.sh
      - name: CycloneDX SBOM and checksums
        run: |
          cd /build/first
          mkdir -p /build/payload
          tar -xzf "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).tar.gz" -C /build/payload
          python3 -B packaging/release/sbom.py /build/payload "$GITHUB_WORKSPACE/dist/SBOM.cdx.json"
          cp "$GITHUB_WORKSPACE/dist/SBOM.cdx.json" "$GITHUB_WORKSPACE/dist/ox-llm-$VERSION-linux-$(uname -m).sbom.cdx.json"
          python3 -B - <<'PY'
          import os, pathlib, re
          payload = pathlib.Path('/build/payload')
          prefixes = [b'/build/first', b'/build/second', os.fsencode(os.environ['HOME']), b'/opt/cargo', b'/opt/rustup']
          for binary in (payload / 'usr/bin').iterdir():
              data = binary.read_bytes()
              assert not any(prefix in data for prefix in prefixes), binary.name
              assert not re.search(rb'/home/[^/\x00\s]+/', data), binary.name
          PY
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  arch-clean-install:
    name: Arch source + binary packages, namcap, clean install and removal
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version || 'v0.2.1' }}
      SOURCE_DATE_EPOCH: ${{ needs.binaries.outputs.source_epoch }}
      OX_SOURCE_COMMIT: ${{ needs.binaries.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-x86_64
          path: artifacts
      - name: Fresh Arch container (official image is x86_64 only)
        run: |
          mkdir packages
          # Size this container from its own runner, reserving one quarter for the host.
          memory_bytes=$(awk '/^MemTotal:/ { printf "%.0f", int($2 * 3 / 4 / 1024) * 1048576 }' /proc/meminfo)
          test "$memory_bytes" -gt 0
          docker run --rm --memory="$memory_bytes" --memory-swap="$memory_bytes" --cgroupns=private \
            -e VERSION -e SOURCE_DATE_EPOCH -e OX_SOURCE_COMMIT \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            -v "$GITHUB_WORKSPACE/packages:/packages" \
            -v "$GITHUB_WORKSPACE/packaging/arch:/recipes:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/smoke.py:/smoke.py:ro" \
            -v "$GITHUB_WORKSPACE/packaging/release/arch-test.sh:/arch-test.sh:ro" \
            archlinux:latest bash /arch-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-packages-x86_64
          path: packages/
          if-no-files-found: error
          retention-days: 7

  real-user-scope:
    name: Exact x64 artifact real user scope and absent-bus refusal
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-x86_64
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-proof-harness-x86_64
          path: proof-harness
      - name: Verify exact source, archive and harness
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c SHA256SUMS)
          (cd proof-harness && sha256sum -c SHA256SUMS)
          test "$(cat proof-harness/SOURCE-COMMIT)" = "$GITHUB_SHA"
          mkdir subject scope-receipts
          tar -xzf "artifacts/ox-llm-$VERSION-linux-x86_64.tar.gz" -C subject
          chmod 755 proof-harness/no-python-proof
      - name: Hosted scope observation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace dbus-user-session
          test -x /usr/bin/busctl
      - name: Real D-Bus scope and unavailable-manager controls
        run: |
          set -euo pipefail
          # Dedicated users on this disposable hosted runner; no product installation.
          created=()
          cleanup() {
            if [[ -n ${uid:-} ]]; then sudo systemctl stop "user@$uid.service" || true; fi
            for user in "${created[@]}"; do
              sudo loginctl terminate-user "$user" || true
              sudo userdel --remove "$user" || true
            done
          }
          trap cleanup EXIT
          for user in ox-proof-scope ox-proof-nobus; do
            ! id "$user" >/dev/null 2>&1
            sudo useradd --create-home --shell /bin/bash "$user"
            created+=("$user")
          done
          uid=$(id -u ox-proof-scope)
          sudo systemctl start "user@$uid.service"
          test -S "/run/user/$uid/bus"
          test ! -e "/run/user/$(id -u ox-proof-nobus)/bus"
          archive="$GITHUB_WORKSPACE/artifacts/ox-llm-$VERSION-linux-x86_64.tar.gz"
          binary="$GITHUB_WORKSPACE/subject/usr/bin/oxa"
          engine="$GITHUB_WORKSPACE/subject/usr/bin/oxe-server"
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          oxa_sha=$(sha256sum "$binary" | cut -d' ' -f1)
          engine_sha=$(sha256sum "$engine" | cut -d' ' -f1)
          for mode in real absent-bus; do
            user=ox-proof-scope
            if [[ $mode == absent-bus ]]; then user=ox-proof-nobus; fi
            receipt="$GITHUB_WORKSPACE/scope-receipts/NO-PYTHON-SCOPE-$mode.txt"
            { printf 'source=%s\nboundary=%s\n' "$GITHUB_SHA" "$mode";
              sha256sum "$archive" "$binary" "$engine"; } > "$receipt"
            sudo runuser -u "$user" -- env -i PATH=/usr/bin:/bin HOME="/home/$user" \
              OXA_TEST_REQUIRE_RELEASE_ARTIFACT=1 OXA_TEST_SCOPE_BOUNDARY="$mode" \
              OXA_TEST_RELEASE_ARCHIVE="$archive" OXA_TEST_RELEASE_ARCHIVE_SHA256="$archive_sha" \
              OXA_TEST_RELEASE_OXA="$binary" OXA_TEST_RELEASE_OXA_SHA256="$oxa_sha" \
              OXA_TEST_RELEASE_OXE_SERVER="$engine" OXA_TEST_RELEASE_OXE_SERVER_SHA256="$engine_sha" \
              "$GITHUB_WORKSPACE/proof-harness/no-python-proof" --nocapture 2>&1 | tee -a "$receipt"
          done
          (cd scope-receipts && sha256sum -- *.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-user-scope-x86_64
          path: scope-receipts/
          if-no-files-found: error
          retention-days: 7
