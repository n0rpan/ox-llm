name: release
# Rust-only release binaries, built from tagged source on GitHub-hosted CPU runners.
# A pushed tag v* builds and qualifies the two-command combined archives, writes
# SHA256SUMS, generates build provenance (actions/attest-build-provenance)
# and creates the GitHub Release with the tag's commit message as its notes.
# No secrets: the job token only. Only the release job holds write permissions and the
# "release" environment, which must be protected in the repository settings (required reviewer,
# deployment tags v*), together with a tag ruleset that limits who may create v* tags.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$REF_NAME
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ $v =~ $re ]]; then echo "bad version string: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  combined:
    # Two-command Rust-only payloads for both architectures; no model weights.
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, combined]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment in the repository settings (see the header).
    environment: release
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance (Sigstore)
      attestations: write  # store the attestation
    env:
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - name: Refuse a release without provenance
        # Artifact attestations need a public repository on GitHub Free/Pro: a release without
        # one is not made from a private repository.
        if: github.event.repository.private
        run: |
          echo "::error::release only from the public repository (no build provenance in a private one)"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*
          path: combined
      - name: Combined archives and SBOMs
        run: |
          set -euo pipefail
          mkdir -p dist
          for a in aarch64 x86_64; do
            for f in "ox-llm-$TAG-linux-$a.tar.gz" "ox-llm-$TAG-linux-$a.sbom.cdx.json"; do
              cp "combined/release-build-$a/$f" "dist/$f"
            done
            sha256sum "dist/ox-llm-$TAG-linux-$a.tar.gz" | sed 's# dist/# #' > "dist/ox-llm-$TAG-linux-$a.tar.gz.sha256"
          done
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          n=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          test "$n" -eq 2
          for a in aarch64 x86_64; do
            test -f "ox-llm-$TAG-linux-$a.tar.gz"
          done
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum ./*.sbom.cdx.json | sed 's# \./# #' >> SHA256SUMS
          rm ./*.tar.gz.sha256
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$((n + 2))"
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.cdx.json
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)
          {
            echo "$changelog"
            echo
            echo "## Binaries"
            echo
            echo "Built by GitHub Actions from \`$TAG\` (commit $GITHUB_SHA) in [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); nobody uploads binaries by hand."
            echo "Linux aarch64, for ARMv8.6-A cores with dotprod, i8mm, fp16 and bf16 (measured on Snapdragon X Elite X1E80100 only); glibc requirement and toolchain in each tarball's README.txt."
            echo "The CPU builds require model-free tests and the exact-archive no-Python proof. Model-based identity, quality and laptop acceptance remain separate owner gates."
            echo
            echo "| File | Contents |"
            echo "|---|---|"
            echo "| \`ox-llm-$TAG-linux-aarch64.tar.gz\` / \`ox-llm-$TAG-linux-x86_64.tar.gz\` | Rust-only: \`oxa\` and \`oxe-server\`, licences, native install/upgrade note and \`.sbom.cdx.json\` |"
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify ox-llm-$TAG-linux-aarch64.tar.gz --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
            echo '```'
            echo
            echo "No model weights are included."
          } > notes.md
          opts=()
          case $TAG in *-*) opts+=(--prerelease);; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sbom.cdx.json dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "ox-llm $TAG" --notes-file notes.md "${opts[@]}"
