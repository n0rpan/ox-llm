[profile.ci]
fail-fast = false
retries = 0
archive.include = [
    { path = "ci/oxa", relative-to = "target", on-missing = "error" },
    { path = "ci/oxa-fake", relative-to = "target", on-missing = "error" },
]

[profile.ci.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
report-skipped = "ignored"
