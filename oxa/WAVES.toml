# WAVES.toml: the oxa wave / task manifest (W0-FROZEN, architect-owned).
# Generated from HARNESS-RS-PLAN.md sec. 5 by the W0 architect. Machine-readable: an
# orchestration workflow fans out one implementer agent per [[task]] of a wave.
#
# Rules (plan sec. 5)
# - Every task consumes oxa-proto and the stubs frozen in W0. Public signatures do not change;
#   a needed change is a note to the architect, never an edit.
# - One owner per file. `owns` lists every file a task may create or edit; nothing else.
#   lib.rs, mod.rs, Cargo.toml, Cargo.lock, prompt/description files and everything marked
#   W0-FROZEN are architect-owned.
# - `needs` = tasks whose IMPLEMENTATION (not stub) the acceptance tests require. Same-wave
#   entries mean: write the code against the stub, the test runs green at the wave checkpoint.
# - Each acceptance bullet is one #[test] in `test_file` (skeleton already present, #[ignore]d
#   with the task id). A task is done when every test of its file is un-ignored and green,
#   plus its own unit tests.
# - size: S <= 25 min, M 25-40 min, L 40-45 min (a split candidate; reserve <= 25 split tasks).
# - Checkpoint after each wave (plan sec. 5): `cargo public-api` diff empty vs the W0 tag, no
#   file touched by two tasks, fmt, clippy -D warnings, tests on both helper runners, the
#   fake invariant suite from wave 2 on, prompt text untouched outside the architect files.

[meta]
plan = "HARNESS-RS-PLAN.md"
proto_version = 2
pi_commit = "47e9d74f9186de37e700693fac0f6e56a499657a"
planned_tasks = 92
fix_slots = 15
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"
architect_files = ["Cargo.toml", "Cargo.lock", "*/Cargo.toml", "*/src/lib.rs", "oxa-proto/**", "oxa-core/src/prompt.rs", "oxa-core/src/state.rs", "oxa-tools/src/descriptions.rs", "oxa-compact/src/prompt.rs", "oxa-fake/src/{turn,scripted,testenv,main}.rs", "oxa-parity/src/lib.rs", "oxa-tui/src/{caps,testterm,theme_core,builtin_themes}.rs", "oxa-tui/src/components/mod.rs", "oxa-interactive/src/{model}.rs", "oxa-interactive/src/{views,selectors}/mod.rs", "oxa-export/src/template.rs", "oxa-export/assets/**", "oxa-ext/src/state.rs", "oxa-codemode/src/hooks.rs", "oxa-mcp/src/{types,transport}.rs", "oxa-resources/src/{resources,frontmatter}.rs", "PARITY.md", "WAVES.toml", "NOTICE", "docs/fake-script.md"]


