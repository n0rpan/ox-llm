[[task]]
id = "A1"
wave = "A"
title = "HTTP/1.1 client and SSE stream reader"
crate = "oxa-engine"
owns = ["oxa-engine/src/http.rs", "oxa-engine/src/sse.rs", "oxa-engine/tests/a1_http_1_1_client_and_sse_stream_reader.rs"]
consumes = ["oxa_proto::{CancelToken, OxaError}"]
provides = ["Url", "http_request", "SseParser", "post_sse"]
needs = []
size = "M"
est_min = 35
test_file = "oxa-engine/tests/a1_http_1_1_client_and_sse_stream_reader.rs"
test_cmd = "cargo test -p oxa-engine --test a1_http_1_1_client_and_sse_stream_reader"
acceptance = [
  { test = "sse_split_at_every_byte_offset", text = "a fixed SSE byte stream fed split at every offset yields the same events" },
  { test = "prefill_comments_are_delivered", text = "`: prefill 10/200` arrives as SseEvent::Comment" },
  { test = "early_close_after_done_is_clean", text = "server closes right after [DONE] -> Ok, done = true" },
  { test = "comments_count_as_liveness", text = "comments every second past the silence limit -> no abort; total silence -> stream_broken" },
  { test = "no_wall_clock_limit", text = "a stream kept alive by comments for longer than the silence limit completes" },
  { test = "refused_is_engine_down_with_hint", text = "connect to a closed port -> engine_down + hint" },
  { test = "cancel_closes_within_200ms", text = "cancel during a held stream -> aborted quickly" },
  { test = "http_request_content_length_and_chunked", text = "both body framings decode" },
  { test = "https_url_rejected", text = "Url::parse(\"https://..\") -> invalid + hint" },
]


