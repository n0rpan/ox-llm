[package]
name = "oxa-a2a"
description = "Bounded A2A 0.3.0 wire profile for opt-in agent orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
agent-host = ["dep:oxa-proto"]

[dependencies]
oxa-http.workspace = true
oxa-proto = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
oxa-a2a = { path = ".", features = ["agent-host"] }
