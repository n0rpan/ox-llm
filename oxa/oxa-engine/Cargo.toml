# W0-FROZEN (architect-owned). Need a dependency? Send a note to the architect.
[package]
name = "oxa-engine"
description = "HTTP + SSE client for the oxe engine and the pure request builder (W1-W3, W6 bytes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
in-process-gateway = ["dep:oxc-gateway", "dep:tokio"]

[dependencies]
oxa-proto.workspace = true
serde_json.workspace = true
oxc-gateway = { path = "../oxc-gateway", default-features = false, features = ["anthropic-gateway", "upstream-openai"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"], optional = true }

[dev-dependencies]
oxa-fake.workspace = true

[lints]
workspace = true
