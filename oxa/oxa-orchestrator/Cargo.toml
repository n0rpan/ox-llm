[package]
name = "oxa-orchestrator"
description = "Opt-in foundations for bounded agent orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
core = ["dep:libc", "dep:serde_json", "dep:sha2", "dep:serde", "dep:oxa-a2a"]

[dependencies]
oxa-a2a = { path = "../oxa-a2a", optional = true, features = ["agent-host"] }
libc = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
oxa-orchestrator = { path = ".", features = ["core"] }
oxa-fake.workspace = true

[lints]
workspace = true
