# W0-FROZEN (architect-owned). Need a dependency? Send a note to the architect.
[package]
name = "oxa-rpc"
description = "Headless modes: print, JSON event stream, RPC server and Rust RPC client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
a2a-control = ["dep:oxa-orchestrator"]

[dependencies]
oxa-proto.workspace = true
oxa-core.workspace = true
oxa-session.workspace = true
oxa-config.workspace = true
oxa-export.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oxa-orchestrator = { path = "../oxa-orchestrator", optional = true, features = ["a2a"] }

[dev-dependencies]
oxa-fake.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
oxa-rpc = { path = ".", features = ["a2a-control"] }

[lints]
workspace = true
