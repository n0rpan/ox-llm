[package]
name = "oxc-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
pricing = ["dep:serde_json", "dep:bigdecimal", "dep:num-traits"]
accounting = ["policy", "pricing", "dep:nix"]
policy = ["dep:serde_json"]
secrets = ["dep:serde_json", "dep:nix"]
transport = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[dependencies]
bigdecimal = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"], optional = true }
nix = { version = "0.30", features = ["user"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
futures-util = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
