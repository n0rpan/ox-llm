[package]
name = "oxc-gateway"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cloud-only = ["dep:serde_json", "dep:url"]
policy = ["dep:serde_json"]
secrets = ["dep:serde_json", "dep:nix"]

[dependencies]
nix = { version = "0.30", features = ["user"], optional = true }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"], optional = true }
url = { version = "2", optional = true }

[[example]]
name = "catalog_contract"
required-features = ["cloud-only"]

[[example]]
name = "policy_contract"
required-features = ["policy"]

[[example]]
name = "secrets_contract"
required-features = ["secrets"]

[lints.rust]
unsafe_code = "forbid"
