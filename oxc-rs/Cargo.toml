[package]
name = "oxc"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
autobins = false

[features]
default = []
native-controller = ["dep:oxc-gateway"]

[[bin]]
name = "oxc-native"
path = "src/parser_main.rs"
required-features = ["native-controller"]

[[bin]]
name = "oxc"
path = "src/main.rs"
required-features = ["native-controller"]

[dependencies]
oxc-gateway = { path = "../oxc-gateway", optional = true, features = ["cloud-only", "policy"] }
axum = "0.8"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "sync", "time", "io-util"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
flate2 = "1"
nix = { version = "0.30", features = ["fs", "signal", "process", "user", "resource", "time", "hostname"] }
futures-util = "0.3"
httparse = "1"
httpdate = "1"
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
fancy-regex = "0.18"
glob = "0.3"

[lints.rust]
unsafe_code = "forbid"

# Keep the self-contained native executable within the unchanged source-payload
# budget. The model engines are separate workspaces and retain their profiles.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
