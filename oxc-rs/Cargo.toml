[package]
name = "oxc"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
autobins = false

[features]
default = []
native-controller = ["dep:serde_json", "dep:chrono", "dep:nix"]
upstream-anthropic-request = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
nix = { version = "0.30", features = ["fs", "user"], optional = true }

[[bin]]
name = "oxc-native"
path = "src/main.rs"
required-features = ["native-controller"]

[lints.rust]
unsafe_code = "forbid"
