[package]
name = "oxc"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
autobins = false

[features]
default = []
native-controller = []
upstream-anthropic-request = ["dep:serde_json", "dep:oxc-gateway", "oxc-gateway/upstream-anthropic-request"]
upstream-anthropic-stream = ["dep:serde_json"]

[dependencies]
oxc-gateway = { path = "../oxa/oxc-gateway", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "oxc-native"
path = "src/main.rs"
required-features = ["native-controller"]

[lints.rust]
unsafe_code = "forbid"
