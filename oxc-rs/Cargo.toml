[package]
name = "oxc"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "sync", "time", "io-util"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
getrandom = "0.3"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
flate2 = "1"
nix = { version = "0.30", features = ["fs", "signal", "process", "user", "resource"] }
futures-util = "0.3"
httparse = "1"
httpdate = "1"
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints.rust]
unsafe_code = "forbid"
