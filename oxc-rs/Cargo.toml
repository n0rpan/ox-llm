[package]
name = "oxc"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
autobins = false

[features]
default = []
native-controller = []
upstream-openai-responses = ["dep:serde_json", "dep:sha2"]
upstream-anthropic-request = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[[bin]]
name = "oxc-native"
path = "src/main.rs"
required-features = ["native-controller"]

[lints.rust]
unsafe_code = "forbid"
