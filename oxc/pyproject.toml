[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oxc"
version = "0.2.0"
description = "Reproducible local AI experiments for Snapdragon X Linux laptops"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES", "third_party/*"]
readme = "README.md"

[project.optional-dependencies]
# D6: the native Anthropic Messages upstream uses the official SDK at request time only.
cloud = ["anthropic==0.125.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oxc = ["runtime/oxc"]
